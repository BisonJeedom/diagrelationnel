<div class="eqLogic eqLogic-widget allowResize text-center" data-eqType="#eqType#"
    data-translate-category="#translate_category#" data-category="#category#" data-tags="#tags#" data-eqLogic_id="#id#"
    data-eqLogic_uid="#uid#" data-version="#version#"
    style="min-width : 50px;min-height : 80px ;border:#border#;border-radius:#border-radius#;background-color: #background-color#;color: #color#;width: #width#;height: #height#;#style#">
    <div class="widget-name">
        <span style="color:#background-color#" title="#alert_name#">
            <i class='#alert_icon#'></i>
        </span>
        <span class="cmd refresh pull-right cursor" data-cmd_id="#refresh_id#">
            <a><i class="fas fa-sync tooltips" title="Mise à jour du diagramme"></i></a>
        </span>
        <span class="cmd pull-right cursor"
            style="margin-left: 3px;margin-top: 5px; color: var(--link-color) !important;">
            <a><i class="fas fa-project-diagram #icon_color# tooltips" style="font-size: small;"
                    title="#icon_tips#"></i></a>
        </span>
        <span class="reportModeVisible">#name_display# <span class="object_name">#object_name#</span></span>
        <a href="#eqLink#" class="reportModeHidden">#name_display# <span class="object_name">#object_name#</span></a>
    </div>
    <center>
        <span>#desc#</span>
        <div id="svgToolBar#id#" style="text-align:center; margin-bottom: 5px;">
            <button class="btn btn-default btn-xs" id="zoomIn#id#">+</button>
            <button class="btn btn-default btn-xs" id="zoomOut#id#">–</button>
            <button class="btn btn-default btn-xs" id="reset#id#">Reset</button>
            <div style="display:flex; justify-content:space-between; margin-top: 10px;">
                <input type="range" id="zoomSlider#id#" min="0.05" max="100" step="0.05" value="0.8"
                    style="width:120px;">
                <span style="font-size: small;">#lastupdate#</span>
            </div>
        </div>
        <div id="svgContainer#id#" style="width:100%; overflow:hidden; position:relative; background: aliceblue;">
            <div id="svgViewport#id#" style="position:absolute; left:0; top:0;">
                #svg#
            </div>
        </div>
    </center>
    <script>
        if ('#refresh_id#' != '') {
            document.querySelector('.eqLogic[data-eqLogic_uid="#uid#"] .refresh')?.addEventListener('click', function () {
                jeedom.cmd.execute({ id: '#refresh_id#' })
            })
        } else {
            document.querySelector('.eqLogic[data-eqLogic_uid="#uid#"] .refresh')?.remove()
        }

        if (typeof jeeFrontEnd !== 'undefined' && jeeFrontEnd.jeedomVersion !== 'undefined' && jeeFrontEnd.jeedomVersion > '4.4.0') {
            document.querySelector('.eqLogic[data-eqLogic_uid="#uid#"] .displayImage')?.addEventListener('click', function (event) {
                jeeDialog.dialog({
                    id: 'md_diagrelationnel',
                    title: 'Diagramme relationnel des scénarios du groupe #group_name#',
                    height: '85%',
                    contentUrl: 'index.php?v=d&plugin=diagrelationnel&modal=modal.diagrelationnel&src=#url#'
                })
            })
        } else {
            $('.displayImage').on('click', function () {
                $('#md_modal').dialog({
                    title: 'Diagramme relationnel des scénarios du groupe #group_name#'
                });
                $('#md_modal').load('index.php?v=d&plugin=diagrelationnel&modal=modal.diagrelationnel&src=' + $(this).attr('src')).dialog('open');
            });
        }

        setTimeout(() => {

            const widget = document.querySelector('.eqLogic[data-eqLogic_uid="#uid#"]');
            const header = widget.querySelector('.widget-name');
            const container = document.getElementById("svgContainer#id#");
            const viewport = document.getElementById("svgViewport#id#");
            const svg = viewport.querySelector("svg");

            if (!svg) return;

            /* --------- Ajustement hauteur --------- */
            container.style.height =
                (widget.offsetHeight - header.offsetHeight - 10) + "px";

            const cW = container.clientWidth;
            const cH = container.clientHeight;

            /****************************************************
             * 1️⃣ Analyse zone utile
             ****************************************************/
            let minX = Infinity, minY = Infinity;
            let maxX = -Infinity, maxY = -Infinity;

            svg.querySelectorAll("*:not(defs):not(style)").forEach(el => {
                try {
                    const b = el.getBBox();
                    if (b.width > 0 && b.height > 0) {
                        minX = Math.min(minX, b.x);
                        minY = Math.min(minY, b.y);
                        maxX = Math.max(maxX, b.x + b.width);
                        maxY = Math.max(maxY, b.y + b.height);
                    }
                } catch (e) { }
            });

            const usefulW = maxX - minX;
            const usefulH = maxY - minY;

            svg.setAttribute("viewBox", `${minX} ${minY} ${usefulW} ${usefulH}`);
            svg.style.width = usefulW + "px";
            svg.style.height = usefulH + "px";

            /****************************************************
             * 2️⃣ FIT + centrage horizontal + scale initial
             ****************************************************/
            const scaleFit = Math.min(cW / usefulW, cH / usefulH);

            let scale = 0.8;

            let panX = (cW - usefulW * scaleFit * scale) / 2;
            let panY = (cH - usefulH * scaleFit * scale) / 2;

            // ✅ Remonte les SVG
            panY -= cH * 0.25;

            /****************************************************
             * 3️⃣ Slider compressé (quadratique)
             ****************************************************/
            const slider = document.getElementById("zoomSlider#id#");

            const minScale = 0.05;
            const maxScale = 100;

            function scaleFromSlider(pos) {
                const t = pos / 100;    // 0 → 1
                return minScale + (maxScale - minScale) * (t * t);
            }

            function sliderFromScale(sc) {
                const t = Math.sqrt((sc - minScale) / (maxScale - minScale));
                return t * 100;
            }

            if (slider) slider.value = sliderFromScale(scale);

            /****************************************************
             * 4️⃣ Apply transform
             ****************************************************/
            function apply() {
                viewport.style.transform =
                    `translate(${panX}px, ${panY}px) scale(${scale * scaleFit})`;
                viewport.style.transformOrigin = "0 0";

                if (slider) {
                    const v = sliderFromScale(scale);
                    if (slider.value != v) slider.value = v;
                }
            }

            apply();

            /****************************************************
             * 5️⃣ Slider → zoom centré sur le centre écran
             ****************************************************/
            if (slider) {
                slider.addEventListener("input", e => {
                    const old = scale;

                    scale = scaleFromSlider(parseFloat(e.target.value));

                    const cx = cW / 2;
                    const cy = cH / 2;

                    const worldX = (cx - panX) / (old * scaleFit);
                    const worldY = (cy - panY) / (old * scaleFit);

                    panX = cx - worldX * scale * scaleFit;
                    panY = cy - worldY * scale * scaleFit;

                    apply();
                });
            }

            /****************************************************
             * 6️⃣ Zoom molette (autour du curseur)
             ****************************************************/
            container.addEventListener("wheel", (e) => {
                e.preventDefault();
                const old = scale;

                // ✅ Zoom molette plus puissant (0.25 au lieu de 0.1)
                scale = Math.min(Math.max(
                    old + (e.deltaY > 0 ? -0.25 : +0.25),
                    minScale
                ), maxScale);

                const rect = container.getBoundingClientRect();
                const px = e.clientX - rect.left;
                const py = e.clientY - rect.top;

                const worldX = (px - panX) / (old * scaleFit);
                const worldY = (py - panY) / (old * scaleFit);

                panX = px - worldX * scale * scaleFit;
                panY = py - worldY * scale * scaleFit;

                apply();
            });

            /****************************************************
             * 7️⃣ PANNING
             ****************************************************/
            let isPanning = false, startX = 0, startY = 0;

            container.addEventListener("mousedown", e => {
                isPanning = true;
                startX = e.clientX - panX;
                startY = e.clientY - panY;
            });

            container.addEventListener("mousemove", e => {
                if (!isPanning) return;
                panX = e.clientX - startX;
                panY = e.clientY - startY;
                apply();
            });

            container.addEventListener("mouseup", () => isPanning = false);

            /****************************************************
             * ✅ 8️⃣ Boutons + et − → zoom centré
             ****************************************************/
            function zoomCentered(delta) {
                const old = scale;
                scale = Math.min(Math.max(old + delta, minScale), maxScale);

                const cx = cW / 2;
                const cy = cH / 2;

                const worldX = (cx - panX) / (old * scaleFit);
                const worldY = (cy - panY) / (old * scaleFit);

                panX = cx - worldX * scale * scaleFit;
                panY = cy - worldY * scale * scaleFit;

                apply();
            }

            document.getElementById("zoomIn#id#")?.addEventListener("click", () => zoomCentered(+0.2));
            document.getElementById("zoomOut#id#")?.addEventListener("click", () => zoomCentered(-0.2));

            /****************************************************
             * 9️⃣ bouton reset
             ****************************************************/
            document.getElementById("reset#id#")?.addEventListener("click", () => {
                scale = 0.8;

                panX = (cW - usefulW * scaleFit * scale) / 2;
                panY = (cH - usefulH * scaleFit * scale) / 2;

                // ✅ Remonte les SVG au reset
                panY -= cH * 0.25;

                apply();
            });

        }, 300);

    </script>
</div>
